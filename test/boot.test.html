<!doctype html>
<meta charset="utf-8">
<title>boot smoke test</title>
<body><pre id="out">running...</pre>
<script>
/* Nạp nguyên app vào iframe, bắt mọi lỗi JS ngay từ lúc khởi động, rồi gọi thử các hàm vừa sửa.
   Bắt được lỗi gõ nhầm tên hàm — thứ mà kiểm tra cú pháp không thấy.
   Lưu ý: `let S` / `const VID` ở top-level KHÔNG thành thuộc tính của window, phải đọc qua w.eval().
   Chạy: chrome --headless --dump-dom test/boot.test.html */
const lines=[];let failed=0;
function ok(c,m){lines.push((c?'  PASS ':'  FAIL ')+m);if(!c)failed++;}

async function main(){
  let html=await (await fetch('../index.html')).text();
  // Cắm bộ bắt lỗi vào TRƯỚC mọi script của app để không bỏ sót lỗi lúc boot.
  html=html.replace(/<head>/i,'<head><script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(e.message)});<\/script>');

  const f=document.createElement('iframe');
  f.style.cssText='width:1200px;height:900px;border:0';
  document.body.appendChild(f);
  await new Promise(res=>{f.onload=res;f.srcdoc=html;});
  const w=f.contentWindow;
  await new Promise(r=>setTimeout(r,1500)); // để app boot xong
  const errs=()=>(w.__errs||[]).join(' | ');

  ok((w.__errs||[]).length===0,'khởi động không có lỗi JS'+(errs()?': '+errs():''));
  ok(w.eval('typeof S')==='object','state S dựng được');
  ok(w.eval('Array.isArray(S.content)'),'S.content là mảng (lỗi TypeError cũ)');
  ok(w.eval('Array.isArray(S.styleSets)'),'S.styleSets là mảng');
  ok(w.eval('typeof S.fashionDna')==='object','S.fashionDna là object');

  // Các hàm của bản vá OOM
  for(const fn of ['mediaThumb','vidTalentChipsHTML','paintVidPicked','paintVidOutfitSel','vidOutfit','vidTalent','renderVideo','scaleDataUrl','renderStyleBrain','styleGenPlan','styleRenderSet','styleFlowPack','styleValidatePlan','styleBuildPack','genFashionDna','omniMasterPrompt','styleCopyOmni','copyVidOmni','styleOmniOpts','geminiVisionMulti','styleVisionPrompt','stylePhotoUpload','styleGenPhotoPlan','styleMode',
      'captionPrompt','genCaption','capCopy','capBlockHTML','directorIdeasPrompt','genDirectorIdeas','directorUpload','directorPick','avoidBlock','divAxisBlock','lifeAxisBlock','twinAnalyzePrompt']){
    ok(typeof w[fn]==='function','có hàm '+fn+'()');
  }

  // Chuyển chế độ Phối đồ khi chưa mở tab: phải im lặng, không ném lỗi
  try{ w.styleMode('photo'); ok(w.eval("STYLE.mode")==='photo','đổi sang chế độ ảnh thật được'); }
  catch(e){ ok(false,'styleMode() ném lỗi: '+e.message); }
  try{ w.stylePhotoDel(0); w.stylePhotoClear(); ok(true,'thao tác ảnh khi khay rỗng không ném lỗi'); }
  catch(e){ ok(false,'thao tác ảnh ném lỗi: '+e.message); }
  w.styleMode('ai');

  // Đạo diễn: thao tác khi chưa có ảnh/ý tưởng nào phải im lặng
  try{ w.directorDel(0); w.directorClear(); w.directorPick(99); ok(true,'thao tác đạo diễn khi rỗng không ném lỗi'); }
  catch(e){ ok(false,'đạo diễn ném lỗi: '+e.message); }
  ok(w.capBlockHTML('khong-ton-tai').indexOf('Caption')>=0,'ảnh chưa có caption thì hiện nút viết');
  ok(w.capText(null)==='','capText rỗng an toàn');

  // Tick outfit khi lưới chưa dựng: phải im lặng, không được ném lỗi
  w.eval('VID.outfits=[]');
  try{ w.vidOutfit('g:khong-ton-tai'); ok(true,'vidOutfit() không ném lỗi khi lưới chưa dựng'); }
  catch(e){ ok(false,'vidOutfit() ném lỗi: '+e.message); }
  ok(w.eval('VID.outfits.length')===1,'vidOutfit() vẫn ghi nhận lựa chọn');

  try{ w.vidTalent(w.eval('VID_TALENTS[0][0]')); ok(true,'vidTalent() không ném lỗi'); }
  catch(e){ ok(false,'vidTalent() ném lỗi: '+e.message); }

  // Cốt lõi bản vá: tick outfit KHÔNG được dựng lại cả lưới ảnh nữa
  w.eval('window.__rendered=0;var __origRV=renderVideo;renderVideo=function(){window.__rendered++;return __origRV.apply(this,arguments)}');
  w.vidOutfit('g:khong-ton-tai-2');
  ok(w.__rendered===0,'tick outfit KHÔNG dựng lại cả lưới (renderVideo gọi '+w.__rendered+' lần)');

  ok((w.__errs||[]).length===0,'không phát sinh lỗi JS trong lúc test'+(errs()?': '+errs():''));
  f.remove(); // gỡ iframe để --dump-dom không in cả app ra
}

main().then(()=>{
  document.getElementById('out').textContent='RESULT '+(failed?'FAIL':'PASS')+'\n'+lines.join('\n');
}).catch(e=>{
  document.getElementById('out').textContent='RESULT FAIL (harness)\n  '+e.message;
});
</script>
